            on_click:
              - lambda: |-
                  id(ui_brightness) += 10;
                  if (id(ui_brightness) > 100) id(ui_brightness) = 20;
                  // TODO: Apply this value to the actual backlight output.
              - lvgl.label.update:
                  id: lbl_setting_brightness
                  text:
                    format: "%d %%"
                    args: [ 'id(ui_brightness)' ]

        - obj:
            id: hit_setting_power
            x: 45
            y: 158
            width: 270
            height: 38
            styles: hmi_touch_area
            on_click:
              - lambda: |-
                  id(plasma_power) += 5;
                  if (id(plasma_power) > 100) id(plasma_power) = 10;
              - lvgl.label.update:
                  id: lbl_setting_power
                  text:
                    format: "%d %%"
