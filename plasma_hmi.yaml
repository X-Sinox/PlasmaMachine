# Plasma Treatment Machine HMI
# 360 x 360 round display
#
# This is an ESPHome LVGL package fragment. Add it to the YAML that already
# defines your ESP32 board, display driver and touchscreen.
#
# The HMI/navigation is functional. Machine I/O actions are intentionally
# placeholders until the motor drivers, plasma output, limit switches and
# safety circuit are defined.

image:
  - platform: file
    id: hmi_bg_splash
    file: "assets/bg_splash.png"
    type: RGB565

  - platform: file
    id: hmi_bg_main
    file: "assets/bg_main.png"
    type: RGB565

  - platform: file
    id: hmi_bg_auto
    file: "assets/bg_auto.png"
    type: RGB565

  - platform: file
    id: hmi_bg_manual
    file: "assets/bg_manual.png"
    type: RGB565

  - platform: file
    id: hmi_bg_recipes
    file: "assets/bg_recipes.png"
    type: RGB565

  - platform: file
    id: hmi_bg_settings
    file: "assets/bg_settings.png"
    type: RGB565

  - platform: file
    id: hmi_bg_service
    file: "assets/bg_service.png"
    type: RGB565

  - platform: file
    id: hmi_bg_alarm
    file: "assets/bg_alarm.png"
    type: RGB565

  - platform: file
    id: hmi_bg_about
    file: "assets/bg_about.png"
    type: RGB565

globals:
  - id: machine_running
    type: bool
    restore_value: false
    initial_value: "false"

  - id: cycle_progress
    type: int
    restore_value: false
    initial_value: "0"

  - id: active_recipe
    type: std::string
    restore_value: true
    initial_value: '"RECIPE 1"'

  - id: active_recipe_index
    type: int
    restore_value: true
    initial_value: "1"

  - id: cup_diameter
    type: float
    restore_value: true
    initial_value: "120.0"

  - id: rotation_speed
    type: int
    restore_value: true
    initial_value: "50"

  - id: vertical_speed
    type: int
    restore_value: true
    initial_value: "20"

  - id: plasma_power
    type: int
    restore_value: true
    initial_value: "80"

  - id: plasma_delay
    type: float
    restore_value: true
    initial_value: "2.0"

  - id: ui_brightness
    type: int
    restore_value: true
    initial_value: "80"

  - id: ui_language
    type: std::string
    restore_value: true
    initial_value: '"EN"'

  - id: ui_units
    type: std::string
    restore_value: true
    initial_value: '"mm / rpm"'

script:
  # Refresh values shown on the automatic-cycle page.
  - id: ui_refresh_auto
    mode: restart
    then:
      - lvgl.label.update:
          id: lbl_auto_recipe
          text: !lambda return id(active_recipe);

      - lvgl.label.update:
          id: lbl_auto_diameter
          text:
            format: "%.1f mm"
            args: [ 'id(cup_diameter)' ]

      - lvgl.label.update:
          id: lbl_auto_rotation
          text:
            format: "%d rpm"
            args: [ 'id(rotation_speed)' ]

      - lvgl.label.update:
          id: lbl_auto_vertical
          text:
            format: "%d mm/s"
            args: [ 'id(vertical_speed)' ]

      - lvgl.label.update:
          id: lbl_auto_power
          text:
            format: "%d %%"
            args: [ 'id(plasma_power)' ]

      - lvgl.bar.update:
          id: bar_auto_progress
          value: !lambda return id(cycle_progress);

      - lvgl.label.update:
          id: lbl_auto_progress
          text:
            format: "%d %%"
            args: [ 'id(cycle_progress)' ]

  # Call this script from the real cycle controller whenever progress changes.
  - id: ui_set_progress
    mode: restart
    parameters:
      value: int
    then:
      - lambda: |-
          id(cycle_progress) = std::max(0, std::min(100, value));
          if (id(cycle_progress) >= 100) {
            id(machine_running) = false;
          }
      - lvgl.bar.update:
          id: bar_auto_progress
          value: !lambda return id(cycle_progress);
      - lvgl.label.update:
          id: lbl_auto_progress
          text:
            format: "%d %%"
            args: [ 'id(cycle_progress)' ]

  # Show an alarm from machine logic:
  # - script.execute:
  #     id: ui_show_alarm
  #     title: "HOME SENSOR ERROR"
  #     message: "X AXIS HOME SENSOR\nNOT DETECTED"
  - id: ui_show_alarm
    mode: restart
    parameters:
      title: string
      message: string
    then:
      - lambda: |-
          id(machine_running) = false;
      - lvgl.label.update:
          id: lbl_alarm_title
          text: !lambda return title;
      - lvgl.label.update:
          id: lbl_alarm_message
          text: !lambda return message;
      - lvgl.page.show:
          id: page_alarm
          animation: FADE_IN
          time: 150ms

  # START request. Connect the marked section to the real cycle state machine.
  - id: machine_start_request
    mode: single
    then:
      - lambda: |-
          id(machine_running) = true;
          id(cycle_progress) = 0;
          // TODO: Validate safety inputs and start the automatic cycle.
      - script.execute: ui_refresh_auto
      - lvgl.page.show:
          id: page_auto
          animation: FADE_IN
          time: 180ms

  # STOP request. This must stop outputs immediately in the real machine logic.
  - id: machine_stop_request
    mode: restart
    then:
      - lambda: |-
          id(machine_running) = false;
          // TODO: Disable plasma output and stop all motion safely.
      - lvgl.page.show:
          id: page_main
          animation: FADE_IN
          time: 150ms

  - id: machine_home_all
    mode: single
    then:
      - lambda: |-
          // TODO: Start homing sequence for all axes.

  - id: jog_x_positive_start
    mode: restart
    then:
      - lambda: |-
          // TODO: Start X-axis positive jog.

  - id: jog_x_negative_start
    mode: restart
    then:
      - lambda: |-
          // TODO: Start X-axis negative jog.

  - id: jog_y_positive_start
    mode: restart
    then:
      - lambda: |-
          // TODO: Start Y-axis positive jog.

  - id: jog_y_negative_start
    mode: restart
    then:
      - lambda: |-
          // TODO: Start Y-axis negative jog.

  - id: jog_all_stop
    mode: restart
    then:
      - lambda: |-
          // TODO: Stop all manual jog motion immediately.

lvgl:
  theme:
    dark_mode: true

  style_definitions:
    # Invisible touch area. A faint blue flash confirms the touch.
    - id: hmi_touch_area
      bg_opa: TRANSP
      border_opa: TRANSP
      shadow_opa: TRANSP
      outline_opa: TRANSP
      radius: 8
      pressed:
        bg_color: 0x00AEEF
        bg_opa: 20%

    - id: hmi_value_green
      text_color: 0x66E631
      text_font: montserrat_14
      text_align: RIGHT
      bg_opa: TRANSP

    - id: hmi_value_white
      text_color: 0xEEF3F6
      text_font: montserrat_14
      text_align: RIGHT
      bg_opa: TRANSP

    - id: hmi_recipe_text
      text_color: 0xEEF3F6
      text_font: montserrat_14
      bg_opa: TRANSP

  on_boot:
    - delay: 3s
    - lvgl.page.show:
        id: page_main
        animation: FADE_IN
        time: 350ms

  pages:
    # -----------------------------------------------------------------------
    # 1. SPLASH
    # -----------------------------------------------------------------------
    - id: page_splash
      bg_color: 0x000000
      pad_all: 0
      scrollable: false
      widgets:
        - image:
            id: img_splash_bg
            src: hmi_bg_splash
            align: CENTER
            clickable: false
            scrollable: false

    # -----------------------------------------------------------------------
    # 2. MAIN MENU
    # -----------------------------------------------------------------------
    - id: page_main
      bg_color: 0x000000
      pad_all: 0
      scrollable: false
      widgets:
        - image:
            id: img_main_bg
            src: hmi_bg_main
            align: CENTER
            clickable: false
            scrollable: false

        # Tap the logo to open machine information.
        - obj:
            id: hit_main_about
            x: 140
            y: 12
            width: 80
            height: 60
            styles: hmi_touch_area
            on_click:
              - lvgl.page.show:
                  id: page_about
                  animation: FADE_IN
                  time: 150ms

        - obj:
            id: hit_main_settings
            x: 25
            y: 78
            width: 105
            height: 77
            styles: hmi_touch_area
            on_click:
              - lvgl.page.show:
                  id: page_settings
                  animation: FADE_IN
                  time: 150ms

        - obj:
            id: hit_main_recipes
            x: 230
            y: 78
            width: 105
            height: 77
            styles: hmi_touch_area
            on_click:
              - lvgl.page.show:
                  id: page_recipes
                  animation: FADE_IN
                  time: 150ms

        - obj:
            id: hit_main_manual
            x: 25
            y: 158
            width: 105
            height: 87
            styles: hmi_touch_area
            on_click:
              - lvgl.page.show:
                  id: page_manual
                  animation: FADE_IN
                  time: 150ms

        - obj:
            id: hit_main_status
            x: 230
            y: 158
            width: 105
            height: 87
            styles: hmi_touch_area
            on_click:
              - script.execute: ui_refresh_auto
              - lvgl.page.show:
                  id: page_auto
                  animation: FADE_IN
                  time: 150ms

        - obj:
            id: hit_main_service
            x: 120
            y: 245
            width: 120
            height: 75
            styles: hmi_touch_area
            on_click:
              - lvgl.page.show:
                  id: page_service
                  animation: FADE_IN
                  time: 150ms

        - obj:
            id: hit_main_start
            x: 108
            y: 91
            width: 144
            height: 144
            radius: 72
            styles: hmi_touch_area
            on_click:
              - script.execute: machine_start_request

    # -----------------------------------------------------------------------
    # 3. AUTOMATIC / RUNNING
    # -----------------------------------------------------------------------
    - id: page_auto
      bg_color: 0x000000
      pad_all: 0
      scrollable: false
      widgets:
        - image:
            id: img_auto_bg
            src: hmi_bg_auto
            align: CENTER
            clickable: false
            scrollable: false

        - label:
            id: lbl_auto_recipe
            x: 155
            y: 64
            width: 155
            height: 22
            text: "RECIPE 1"
            text_color: 0x66E631
            text_font: montserrat_14
            text_align: RIGHT

        - label:
            id: lbl_auto_diameter
            x: 220
            y: 102
            width: 92
            height: 22
            text: "120.0 mm"
            styles: hmi_value_green

        - label:
            id: lbl_auto_rotation
            x: 220
            y: 141
            width: 92
            height: 22
            text: "50 rpm"
            styles: hmi_value_green

        - label:
            id: lbl_auto_vertical
            x: 220
            y: 180
            width: 92
            height: 22
            text: "20 mm/s"
            styles: hmi_value_green

        - label:
            id: lbl_auto_power
            x: 220
            y: 219
            width: 92
            height: 22
            text: "80 %"
            styles: hmi_value_green

        - label:
            id: lbl_auto_progress
            x: 260
            y: 260
            width: 52
            height: 22
            text: "0 %"
            styles: hmi_value_green

        - bar:
            id: bar_auto_progress
            x: 50
            y: 288
            width: 260
            height: 16
            min_value: 0
            max_value: 100
            value: 0
            animated: true
            bg_opa: TRANSP
            border_opa: TRANSP
            indicator:
              bg_color: 0x63E62E
              bg_opa: COVER
              radius: 4

        - obj:
            id: hit_auto_stop
            x: 103
            y: 317
            width: 154
            height: 34
            styles: hmi_touch_area
            on_click:
              - script.execute: machine_stop_request

    # -----------------------------------------------------------------------
    # 4. MANUAL CONTROL
    # -----------------------------------------------------------------------
    - id: page_manual
      bg_color: 0x000000
      pad_all: 0
      scrollable: false
      widgets:
        - image:
            id: img_manual_bg
            src: hmi_bg_manual
            align: CENTER
            clickable: false
            scrollable: false

        - obj:
            id: hit_manual_y_plus
            x: 130
            y: 58
            width: 100
            height: 65
            styles: hmi_touch_area
            on_press:
              - script.execute: jog_y_positive_start
            on_release:
              - script.execute: jog_all_stop

        - obj:
            id: hit_manual_x_minus
            x: 45
            y: 125
            width: 90
            height: 80
            styles: hmi_touch_area
            on_press:
              - script.execute: jog_x_negative_start
            on_release:
              - script.execute: jog_all_stop

        - obj:
            id: hit_manual_home_center
            x: 145
            y: 130
            width: 70
            height: 70
            radius: 35
            styles: hmi_touch_area
            on_click:
              - script.execute: machine_home_all

        - obj:
            id: hit_manual_x_plus
            x: 225
            y: 125
            width: 90
            height: 80
            styles: hmi_touch_area
            on_press:
              - script.execute: jog_x_positive_start
            on_release:
              - script.execute: jog_all_stop

        - obj:
            id: hit_manual_y_minus
            x: 130
            y: 207
            width: 100
            height: 65
            styles: hmi_touch_area
            on_press:
              - script.execute: jog_y_negative_start
            on_release:
              - script.execute: jog_all_stop

        - obj:
            id: hit_manual_home_all
            x: 55
            y: 280
            width: 250
            height: 38
            styles: hmi_touch_area
            on_click:
              - script.execute: machine_home_all

        - obj:
            id: hit_manual_back
            x: 80
            y: 326
            width: 200
            height: 28
            styles: hmi_touch_area
            on_click:
              - script.execute: jog_all_stop
              - lvgl.page.show:
                  id: page_main
                  animation: FADE_IN
                  time: 150ms

    # -----------------------------------------------------------------------
    # 5. RECIPES
    # -----------------------------------------------------------------------
    - id: page_recipes
      bg_color: 0x000000
      pad_all: 0
      scrollable: false
      widgets:
        - image:
            id: img_recipes_bg
            src: hmi_bg_recipes
            align: CENTER
