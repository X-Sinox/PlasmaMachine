              - lambda: |-
                  id(plasma_delay) += 0.5f;
                  if (id(plasma_delay) > 5.0f) id(plasma_delay) = 0.5f;
              - lvgl.label.update:
                  id: lbl_setting_delay
                  text:
                    format: "%.1f s"
                    args: [ 'id(plasma_delay)' ]

        - obj:
            id: hit_setting_units
            x: 45
            y: 254
            width: 270
            height: 38
            styles: hmi_touch_area
            on_click:
              - lambda: |-
                  id(ui_units) = (id(ui_units) == "mm / rpm") ? "in / rpm" : "mm / rpm";
              - lvgl.label.update:
                  id: lbl_setting_units
                  text: !lambda return id(ui_units);

        - obj:
            id: hit_settings_back
            x: 80
            y: 328
            width: 200
            height: 26
            styles: hmi_touch_area
            on_click:
              - lvgl.page.show:
                  id: page_main
                  animation: FADE_IN
                  time: 150ms

