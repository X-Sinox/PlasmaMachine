  type: RGB565
- platform: file
  id: hmi_bg_about
  file: https://raw.githubusercontent.com/X-Sinox/PlasmaMachine/main/assets/bg_about.png
  type: RGB565
lvgl:
  theme:
    dark_mode: true
  style_definitions:
  - id: hmi_touch_area
    bg_opa: TRANSP
    border_opa: TRANSP
    shadow_opa: TRANSP
    outline_opa: TRANSP
    radius: 8
    pressed:
      bg_color: 0x00AEEF
      bg_opa: 20%
  - id: hmi_value_green
    text_color: 0x66E631
    text_font: montserrat_14
    text_align: RIGHT
    bg_opa: TRANSP
  - id: hmi_value_white
    text_color: 0xEEF3F6
    text_font: montserrat_14
    text_align: RIGHT
    bg_opa: TRANSP
  - id: hmi_recipe_text
    text_color: 0xEEF3F6
    text_font: montserrat_14
    bg_opa: TRANSP
  pages:
  - id: page_splash
    bg_color: 0x000000
    pad_all: 0
    scrollable: false
    widgets:
    - image:
        id: img_splash_bg
        src: hmi_bg_splash
        align: CENTER
        clickable: false
        scrollable: false
  - id: page_main
    bg_color: 0x000000
    pad_all: 0
    scrollable: false
    widgets:
    - image:
        id: img_main_bg
