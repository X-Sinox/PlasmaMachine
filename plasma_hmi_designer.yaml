# Plasma Machine HMI - Designer import source
# Visual layout only: images, pages, labels, bars and invisible touch zones.
# Runtime scripts and machine actions remain in plasma_hmi.yaml and are not
# intentionally round-tripped through the online Designer.

image:
- platform: file
  id: hmi_bg_splash
  file: https://raw.githubusercontent.com/X-Sinox/PlasmaMachine/main/assets/bg_splash.png
  type: RGB565
- platform: file
  id: hmi_bg_main
  file: https://raw.githubusercontent.com/X-Sinox/PlasmaMachine/main/assets/bg_main.png
  type: RGB565
- platform: file
  id: hmi_bg_auto
  file: https://raw.githubusercontent.com/X-Sinox/PlasmaMachine/main/assets/bg_auto.png
  type: RGB565
- platform: file
  id: hmi_bg_manual
